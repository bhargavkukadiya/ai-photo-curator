name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked core and test dependencies
        run: |
          python -m pip install --upgrade uv
          uv lock --check
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - name: Run tests and validate the wheel
        run: |
          uv run --frozen --extra dev pytest -v
          uv build --wheel
          uv run --frozen --extra dev python scripts/check_wheel.py

  optional-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and test locked optional backends
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra dev --extra emotion --extra heic
          uv run --frozen --extra dev --extra emotion --extra heic pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit every locked package version and extra
        run: |
          python -m pip install --upgrade pip-audit
          python scripts/audit_lock.py
